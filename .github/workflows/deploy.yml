name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy LajuTopup to new server
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SERVER_HOST: 103.31.39.97
      SERVER_PORT: '22'
      SERVER_USER: lajutopup-deploy

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Skip superseded release
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$RELEASE_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit exists; this release will not be deployed.'
          fi

      - name: Setup Go
        if: steps.revision.outputs.current == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: pulsa-be/go.mod
          cache-dependency-path: pulsa-be/go.sum

      - name: Setup Node
        if: steps.revision.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pulsa-fe/package-lock.json

      - name: Test and build Linux x86-64 backend
        if: steps.revision.outputs.current == 'true'
        working-directory: pulsa-be
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          mkdir -p ../deploy/backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../deploy/backend/lajutopup-api .

      - name: Build frontend standalone
        if: steps.revision.outputs.current == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: 'false'
          NEXT_PUBLIC_TURNSTILE_ENABLED: 'false'
          NEXT_PUBLIC_SITE_URL: https://lajutopup.com
          NEXTAUTH_URL: https://lajutopup.com
          API_BASE: http://127.0.0.1:8106
        shell: bash
        run: |
          set -euo pipefail
          cd pulsa-fe
          npm ci
          npm run build
          cd ..
          mkdir -p deploy/frontend/.next
          cp -R pulsa-fe/.next/standalone/. deploy/frontend/
          cp -R pulsa-fe/.next/static deploy/frontend/.next/static
          cp -R pulsa-fe/public deploy/frontend/public
          printf '%s\n' "$RELEASE_SHA" > deploy/DEPLOY_COMMIT
          printf '%s\n' "$RELEASE_SHA" > deploy/frontend/public/deploy-version.txt
          tar -czf release.tar.gz -C deploy DEPLOY_COMMIT backend frontend
          sha256sum release.tar.gz > release.sha256

      - name: Configure verified SSH connection
        if: steps.revision.outputs.current == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.LAJUTOPUP_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.LAJUTOPUP_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/lajutopup-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/lajutopup-known-hosts"
          chmod 600 "$HOME/.ssh/lajutopup-deploy" "$HOME/.ssh/lajutopup-known-hosts"

      - name: Upload and activate verified release
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$RELEASE_SHA" ]; then
            echo 'Newer main commit found before activation; refusing a stale deployment.'
            exit 1
          fi
          opts=(-i "$HOME/.ssh/lajutopup-deploy" -o IdentitiesOnly=yes
                -o BatchMode=yes -o StrictHostKeyChecking=yes
                -o "UserKnownHostsFile=$HOME/.ssh/lajutopup-known-hosts"
                -o ConnectTimeout=15)
          target="${SERVER_USER}@${SERVER_HOST}"
          scp "${opts[@]}" -P "$SERVER_PORT" release.tar.gz "$target:incoming/release.tar.gz.upload"
          scp "${opts[@]}" -P "$SERVER_PORT" release.sha256 "$target:incoming/release.sha256.upload"
          ssh "${opts[@]}" -p "$SERVER_PORT" "$target" '
            set -eu
            cd "$HOME/incoming"
            mv release.tar.gz.upload release.tar.gz
            mv release.sha256.upload release.sha256
            sudo -n /usr/local/sbin/lajutopup-activate
          '

      - name: Verify public release
        if: steps.revision.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          actual=$(curl --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 20 \
            "https://lajutopup.com/deploy-version.txt?commit=${RELEASE_SHA}")
          test "$actual" = "$RELEASE_SHA"
          curl --fail --silent --show-error --max-time 20 -o /dev/null https://lajutopup.com/
          printf 'Deployed `%s` to https://lajutopup.com\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/lajutopup-deploy" "$HOME/.ssh/lajutopup-known-hosts"
