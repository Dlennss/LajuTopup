name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pulsa-be

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pulsa-be/go.mod
          cache-dependency-path: pulsa-be/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./internal/service ./internal/helper ./internal/provider ./internal/repository

      - name: Build backend
        run: go build -o /tmp/lajutopup-api .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: pulsa-fe
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXTAUTH_URL: http://localhost:3106
      NEXT_PUBLIC_SITE_URL: http://localhost:3106
      API_BASE: http://localhost:8106
      NEXT_PUBLIC_API_BASE: http://localhost:8106
      AUTH_SECRET: ci-placeholder-secret-do-not-use-in-production
      NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: "false"
      NEXT_PUBLIC_TURNSTILE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pulsa-fe/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
