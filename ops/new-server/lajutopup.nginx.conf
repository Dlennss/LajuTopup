server {
    listen 80;
    server_name lajutopup.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/lajutopup; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lajutopup.com;
    ssl_certificate /etc/letsencrypt/live/lajutopup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lajutopup.com/privkey.pem;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/ {
        proxy_pass http://127.0.0.1:8106;
    }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8106;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:8106;
    }
    location / {
        proxy_pass http://127.0.0.1:3106;
    }
}
